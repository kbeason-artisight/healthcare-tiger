  <circle cx="23.5" cy="75.5" r="3.5" fill="#E3ECFA"/>
  <circle cx="12.5" cy="47" r="3.5" fill="#2B1B0E"/>
  <circle cx="12.5" cy="47" r="2.2" fill="#7FB0FF"/>
  <circle cx="87.5" cy="47" r="3.5" fill="#2B1B0E"/>
