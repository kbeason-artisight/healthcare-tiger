<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <circle cx="50" cy="50" r="48" fill="#E8791A" />

  <!-- ears -->
  <circle cx="27" cy="24" r="12" fill="#E8791A" stroke="#1F1300" stroke-width="3" />
  <circle cx="73" cy="24" r="12" fill="#E8791A" stroke="#1F1300" stroke-width="3" />
  <circle cx="27" cy="25" r="5" fill="#FFF3E4" />
  <circle cx="73" cy="25" r="5" fill="#FFF3E4" />

  <!-- head -->
  <ellipse cx="50" cy="52" rx="34" ry="30" fill="#F2934A" stroke="#1F1300" stroke-width="3" />

  <!-- stripes -->
  <path d="M22 34 L30 44" stroke="#1F1300" stroke-width="4" stroke-linecap="round" />
  <path d="M78 34 L70 44" stroke="#1F1300" stroke-width="4" stroke-linecap="round" />
  <path d="M18 52 L28 54" stroke="#1F1300" stroke-width="4" stroke-linecap="round" />
  <path d="M82 52 L72 54" stroke="#1F1300" stroke-width="4" stroke-linecap="round" />
  <path d="M50 20 L50 30" stroke="#1F1300" stroke-width="4" stroke-linecap="round" />

  <!-- muzzle -->
  <ellipse cx="50" cy="62" rx="19" ry="14" fill="#FFF3E4" stroke="#1F1300" stroke-width="3" />

  <!-- eyes -->
  <ellipse cx="38" cy="50" rx="5" ry="6" fill="#1F1300" />
  <ellipse cx="62" cy="50" rx="5" ry="6" fill="#1F1300" />
  <circle cx="39.5" cy="48" r="1.4" fill="#FFFFFF" />
  <circle cx="63.5" cy="48" r="1.4" fill="#FFFFFF" />

  <!-- nose + mouth -->
  <path d="M46 58 L54 58 L50 63 Z" fill="#1F1300" />
  <path d="M50 63 L50 67" stroke="#1F1300" stroke-width="2.5" stroke-linecap="round" />
  <path d="M50 67 Q44 72 39 68" stroke="#1F1300" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <path d="M50 67 Q56 72 61 68" stroke="#1F1300" stroke-width="2.5" fill="none" stroke-linecap="round" />

  <!-- stethoscope -->
  <path
    d="M31 66 C31 78 41 84 50 84 C59 84 69 78 69 66"
    stroke="#2E6FE3"
    stroke-width="3.5"
    fill="none"
    stroke-linecap="round"
  />
  <circle cx="31" cy="63" r="3.5" fill="#2E6FE3" />
  <circle cx="69" cy="63" r="3.5" fill="#2E6FE3" />
  <circle cx="50" cy="87" r="5.5" fill="#2E6FE3" stroke="#1F1300" stroke-width="1.5" />
</svg>
