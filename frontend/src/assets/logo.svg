<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 118" role="img" aria-label="Healthcare Tiger">
  <!-- Healthcare Tiger — kawaii tiger mascot wearing a stethoscope -->
  <defs>
    <clipPath id="ht-head-clip">
      <path d="M12.5 13 C8 24, 6 33, 7.5 44 C9 62, 16 76, 29 82 C35.5 85, 43 86.5, 50 86.5 C57 86.5, 64.5 85, 71 82 C84 76, 91 62, 92.5 44 C94 33, 92 24, 87.5 13 C89.5 8.5, 85 6.5, 79 9.5 C73 12.5, 66 17.5, 62 22.5 C58 21, 42 21, 38 22.5 C34 17.5, 27 12.5, 21 9.5 C15 6.5, 10.5 8.5, 12.5 13 Z"/>
    </clipPath>
  </defs>

  <!-- head + ears: one continuous silhouette -->
  <path d="M12.5 13 C8 24, 6 33, 7.5 44 C9 62, 16 76, 29 82 C35.5 85, 43 86.5, 50 86.5 C57 86.5, 64.5 85, 71 82 C84 76, 91 62, 92.5 44 C94 33, 92 24, 87.5 13 C89.5 8.5, 85 6.5, 79 9.5 C73 12.5, 66 17.5, 62 22.5 C58 21, 42 21, 38 22.5 C34 17.5, 27 12.5, 21 9.5 C15 6.5, 10.5 8.5, 12.5 13 Z" fill="#F2934A"/>

  <g clip-path="url(#ht-head-clip)">
    <!-- warm shading along the lower silhouette -->
    <path d="M0 62 C10 84, 30 96, 50 96 C70 96, 90 84, 100 62 L100 100 L0 100 Z" fill="#E8791A" opacity=".45"/>

    <!-- inner ears -->
    <path d="M16.8 13.6 C21 15.5, 27 19, 31 22.5 C26 25.5, 19 25.5, 15 22.5 C13.2 19.5, 14 15.5, 16.8 13.6 Z" fill="#F7AE95"/>
    <path d="M83.2 13.6 C79 15.5, 73 19, 69 22.5 C74 25.5, 81 25.5, 85 22.5 C86.8 19.5, 86 15.5, 83.2 13.6 Z" fill="#F7AE95"/>

    <!-- cream face mask -->
    <path d="M50 46.5 C62.5 43.5, 76.5 50, 78.5 62 C80.5 74.5, 68 84.5, 50 84.5 C32 84.5, 19.5 74.5, 21.5 62 C23.5 50, 37.5 43.5, 50 46.5 Z" fill="#FFF3E4"/>

    <!-- tapered stripes -->
    <g fill="#2B1B0E">
      <path d="M42.6 13 C45.4 21, 45.6 28, 44.2 33.8 C42.2 28.6, 40 22.4, 37.2 13 Z"/>
      <path d="M57.4 13 C54.6 21, 54.4 28, 55.8 33.8 C57.8 28.6, 60 22.4, 62.8 13 Z"/>
      <path d="M34 15 C36.4 20.5, 37.4 25, 37.2 29.4 C35.4 25.4, 33.2 21, 30.6 15.6 Z"/>
      <path d="M66 15 C63.6 20.5, 62.6 25, 62.8 29.4 C64.6 25.4, 66.8 21, 69.4 15.6 Z"/>
      <path d="M0 20 C10 23, 18 27.2, 23.5 32 C17 33.6, 8 31, 0 27 Z"/>
      <path d="M100 20 C90 23, 82 27.2, 76.5 32 C83 33.6, 92 31, 100 27 Z"/>
      <path d="M0 31 C8.5 33.5, 15.5 37.4, 21 42 C14.5 43.4, 6.5 41, 0 37.6 Z"/>
      <path d="M100 31 C91.5 33.5, 84.5 37.4, 79 42 C85.5 43.4, 93.5 41, 100 37.6 Z"/>
    </g>

    <!-- two-lobe muzzle + whisker dots -->
    <path d="M50 63.2 C53 61.2, 57 61.6, 60.5 63 C66 65.2, 69 70.5, 67.4 74.8 C65.6 79.4, 59 80.6, 54.6 77.8 C52.8 76.6, 51.2 75.2, 50 73.8 C48.8 75.2, 47.2 76.6, 45.4 77.8 C41 80.6, 34.4 79.4, 32.6 74.8 C31 70.5, 34 65.2, 39.5 63 C43 61.6, 47 61.2, 50 63.2 Z" fill="#FFFCF6"/>
    <g fill="#E4C6A4">
      <circle cx="39.5" cy="68.5" r=".9"/><circle cx="37.4" cy="72.4" r=".9"/><circle cx="40.6" cy="73.6" r=".9"/>
      <circle cx="60.5" cy="68.5" r=".9"/><circle cx="62.6" cy="72.4" r=".9"/><circle cx="59.4" cy="73.6" r=".9"/>
    </g>
  </g>

  <!-- single outline over the whole head silhouette -->
  <path d="M12.5 13 C8 24, 6 33, 7.5 44 C9 62, 16 76, 29 82 C35.5 85, 43 86.5, 50 86.5 C57 86.5, 64.5 85, 71 82 C84 76, 91 62, 92.5 44 C94 33, 92 24, 87.5 13 C89.5 8.5, 85 6.5, 79 9.5 C73 12.5, 66 17.5, 62 22.5 C58 21, 42 21, 38 22.5 C34 17.5, 27 12.5, 21 9.5 C15 6.5, 10.5 8.5, 12.5 13 Z" fill="none" stroke="#2B1B0E" stroke-width="3.4" stroke-linejoin="round"/>

  <!-- eyes -->
  <ellipse cx="31.5" cy="54" rx="7.6" ry="8.4" fill="#2B1B0E"/>
  <ellipse cx="68.5" cy="54" rx="7.6" ry="8.4" fill="#2B1B0E"/>
  <circle cx="29.1" cy="50.4" r="2.7" fill="#FFFFFF"/>
  <circle cx="66.1" cy="50.4" r="2.7" fill="#FFFFFF"/>
  <circle cx="34.4" cy="57.8" r="1.3" fill="#FFFFFF" opacity=".85"/>
  <circle cx="71.4" cy="57.8" r="1.3" fill="#FFFFFF" opacity=".85"/>

  <!-- nose + smile -->
  <path d="M45.4 62.6 C47 61.6, 53 61.6, 54.6 62.6 C56.2 63.7, 53.2 68.6, 50 68.6 C46.8 68.6, 43.8 63.7, 45.4 62.6 Z" fill="#2B1B0E"/>
  <g fill="none" stroke="#2B1B0E" stroke-width="2.4" stroke-linecap="round">
    <path d="M50 68.6 L50 71.6"/>
    <path d="M50 71.6 C48.6 74.6, 44.6 75.2, 42.8 73.2"/>
    <path d="M50 71.6 C51.4 74.6, 55.4 75.2, 57.2 73.2"/>
  </g>

  <!-- stethoscope: classic standalone icon shape (earpieces -> wide loop -> single
       tail -> ringed chestpiece). Routed along the OUTSIDE of the head silhouette
       so it never crosses the face, converging into a loop just below the chin
       and trailing off to a chestpiece hanging in the open space below. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- dark outline pass, drawn wider and behind -->
    <g stroke="#2B1B0E" stroke-width="9.6">
      <path d="M14 28 C6 36, 4 48, 6 60 C8 72, 16 82, 28 86 C36 88.5, 44 88.5, 49 87.5"/>
      <path d="M86 28 C94 36, 96 48, 94 60 C92 72, 84 82, 72 86 C64 88.5, 56 88.5, 51 87.5"/>
      <path d="M50 87.7 C58 92, 65 95.5, 73 97.5"/>
    </g>
    <!-- gray tube -->
    <g stroke="#9CA4AF" stroke-width="7">
      <path d="M14 28 C6 36, 4 48, 6 60 C8 72, 16 82, 28 86 C36 88.5, 44 88.5, 49 87.5"/>
      <path d="M86 28 C94 36, 96 48, 94 60 C92 72, 84 82, 72 86 C64 88.5, 56 88.5, 51 87.5"/>
      <path d="M50 87.7 C58 92, 65 95.5, 73 97.5"/>
    </g>
  </g>

  <!-- earpieces, tucked just outside the ear roots -->
  <g stroke="#2B1B0E" stroke-width="1.6">
    <ellipse cx="13" cy="26" rx="5" ry="6" fill="#9CA4AF" transform="rotate(-30 13 26)"/>
    <ellipse cx="87" cy="26" rx="5" ry="6" fill="#9CA4AF" transform="rotate(30 87 26)"/>
  </g>

  <!-- chestpiece -->
  <circle cx="77" cy="99.5" r="13.5" fill="#2B1B0E"/>
  <circle cx="77" cy="99.5" r="11" fill="#9CA4AF"/>
  <circle cx="77" cy="99.5" r="7" fill="#FFFFFF"/>
  <circle cx="77" cy="99.5" r="2.8" fill="#9CA4AF"/>
</svg>
